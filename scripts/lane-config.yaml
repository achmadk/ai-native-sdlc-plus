# Lane rules v1. First match wins. Ambiguous or malformed input escalates, never Lite.
version: 1
critical:
  - "auth/**"
  - "**/auth*/**"
  - "**/*auth*"
  - "payments/**"
  - "**/payment*/**"
  - "**/billing*/**"
  - "migrations/**"
  - "**/migrate*/**"
  - "infra/**"
  - "**/terraform*/**"
  - "**/.github/workflows/**"
  - "security/**"
  - "**/secrets*/**"
  - "**/*secret*"
  - "**/crypto*/**"
standard:
  - "src/**"
  - "lib/**"
  - "app/**"
  - "skills/**"
  - "scripts/**"
  - "**/*.py"
  - "**/*.ts"
  - "**/*.js"
  - "**/*.go"
  - "**/*.rs"
lite:
  - "docs/**"
  - "**/*.md"
  - "**/*.txt"
  - "**.cfg"
  - "**.ini"
  - "**.yaml"
  - "**.yml"
