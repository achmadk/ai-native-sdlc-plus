# Lane rules. Schema version 1. lane.py rejects unknown keys and wrong versions
# on purpose: a typo here must fail loudly, not silently downgrade a lane.
#
# Matching: the HIGHEST lane of any changed path wins. A path that matches no
# rule is Standard. Lite therefore means "every path matched a Lite rule".
# Glob: * and ? stay inside one path segment, ** crosses segments.
#   - no "/" in the pattern  -> matches that name at any depth   (Dockerfile, *.lock)
#   - a "/" in the pattern   -> anchored at the repo root        (src/**, **/*.md)
# Critical rules match case-insensitively (fail safe).
# Always Critical, regardless of this file (see BUILTIN_CRITICAL in lane.py):
#   scripts/**, installers/state, CI workflows/adapters, CODEOWNERS, hooks,
#   skill instructions/scripts and supported agent-control files.
# Version identifies the config format; policy edits do not change that format.
version: 1

critical:            # CALIBRATE on your first repo; track how often this fires
  - "**/auth/**"
  - "**/authentication/**"
  - "**/payment/**"
  - "**/payments/**"
  - "**/migrations/**"
  - "**/infra/**"
  - "**/infrastructure/**"
  - "**/security/**"
  - "skills/*/SKILL.md"      # skill instructions are behaviour, not prose
  - "skills/*/scripts/**"

standard:
  - "*.lock"
  - "package-lock.json"
  - "npm-shrinkwrap.json"
  - "pnpm-lock.yaml"
  - "src/**"
  - "skills/**"
  - "adapters/**"
  - "evals/**"

lite:
  - "docs/**"
  - "README.md"
  - "CHANGELOG.md"

# Optional. Paths that count as tests for the test_changes evidence.
tests:
  - "test"
  - "tests"
  - "__tests__"
  - "*_test.*"
  - "test_*.*"
  - "*.test.*"
  - "*.spec.*"
  - "evals/**"

# Optional. Changes touching ONLY these paths (Lite/Standard) need no test evidence.
# Do not add *.md here if Markdown is behaviour in your repo (e.g. SKILL.md).
non_executable:
  - "docs/**"
  - "LICENSE"
  - "CHANGELOG.md"
  - "README.md"
  - ".gitignore"
